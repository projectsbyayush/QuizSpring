spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}

logging:
  level:
    com.quizplatform: DEBUG
