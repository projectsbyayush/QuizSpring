spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: quiz-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quizplatform}
    username: ${DATABASE_USERNAME:quiz}
    password: ${DATABASE_PASSWORD:quiz}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}
  attempts:
    grace-period-seconds: ${ATTEMPT_GRACE_PERIOD_SECONDS:5}
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      email: ${SEED_ADMIN_EMAIL:}
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.quizplatform: INFO
